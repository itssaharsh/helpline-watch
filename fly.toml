# fly launch --copy-config --yes && fly deploy
app = "helpline-watch"
primary_region = "bom"

[env]
  HELPLINE_MODE = "replay"
  HELPLINE_DATA_DIR = "/srv/data"
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
