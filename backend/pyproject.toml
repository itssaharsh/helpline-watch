[project]
name = "helpline-watch"
version = "0.1.0"
description = "Finds the fake customer-care numbers scammers plant on Google Search, Maps and ads, city by city, before customers call them."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]
llm = ["anthropic>=0.40"]

[project.scripts]
helpline-watch = "helpline_watch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["helpline_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long f-strings in reports and SQL; ruff format is not used on purpose

[tool.ruff.lint.per-file-ignores]
"helpline_watch/cli.py" = ["B008"]  # typer.Argument defaults are the typer idiom
