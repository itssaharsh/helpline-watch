name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: cd backend && uv venv .venv && uv pip install -e ".[dev]"
      - run: cd backend && .venv/bin/ruff check helpline_watch tests scripts
      - run: cd backend && .venv/bin/python -m pytest -q
      - run: backend/.venv/bin/python scripts/validate.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint && npx tsc -b && npm run build
